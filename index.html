<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuildWise AI — Intelligent Home Construction Planning Platform</title>
  <meta name="description" content="Autonomous multi-agent construction orchestration platform for home design, cost, timeline, and risk planning." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23224435'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/></svg>" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/index.css">
  <style>
    .floor-svg-wrap {
      background: #193125;
      border: 2px solid var(--primary);
      border-radius: var(--radius-lg);
      padding: 18px;
      overflow-x: auto;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
    }
    .svg-room-rect {
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .svg-room-rect:hover {
      filter: brightness(1.12);
      stroke: #F9F4BE !important;
      stroke-width: 3 !important;
    }
    .tab-btn {
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--primary);
      background: transparent;
      color: var(--primary);
      transition: var(--transition);
    }
    .tab-btn.active {
      background: var(--primary);
      color: #FFFFFF;
    }
    .color-swatch {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.15);
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="app" class="app-container">
    <!-- Dynamic Content Rendered Here -->
  </div>

  <script>
    // =========================================================
    // BUILDWISE AI - CENTRALIZED DYNAMIC CLIENT APPLICATION
    // =========================================================

    const state = {
      activePage: 'landing',
      projects: [],
      currentProject: null,
      healthScore: null,
      decisions: [],
      contractors: [],
      aiPlan: null,
      selectedFloor: 1,
      loading: false,
      notice: null,
      error: null,
      whatIfResult: null
    };

    // Central API calls
    async function apiRequest(endpoint, method = 'GET', data = null) {
      const options = {
        method,
        headers: { 'Content-Type': 'application/json' }
      };
      if (data) {
        options.body = JSON.stringify(data);
      }
      const response = await fetch(endpoint, options);
      if (!response.ok) {
        let err = `HTTP ${response.status}`;
        try {
          const json = await response.json();
          err = json.detail || JSON.stringify(json);
        } catch(e) {}
        throw new Error(err);
      }
      return await response.json();
    }

    async function init() {
      render(); // Render base layout immediately so page is never blank
      try {
        state.projects = await apiRequest('/api/projects');
        if (state.projects.length > 0) {
          await selectProject(state.projects[0].id);
        }
      } catch (e) {
        console.warn("Init error:", e);
      }
      render();
    }

    async function selectProject(id) {
      try {
        state.loading = true;
        render();
        state.currentProject = await apiRequest(`/api/projects/${id}`);
        state.selectedFloor = 1;
        
        // Load AI Plan (auto-generates if not yet created)
        try { 
          state.aiPlan = await apiRequest(`/api/projects/${id}/ai-plan`); 
        } catch(e) { 
          state.aiPlan = null; 
        }

        try { state.healthScore = await apiRequest(`/api/projects/${id}/health-score`); } catch(e) { state.healthScore = null; }
        try { state.decisions = await apiRequest(`/api/projects/${id}/decisions`); } catch(e) { state.decisions = []; }
        try { state.contractors = await apiRequest(`/api/contractors?location=${encodeURIComponent(state.currentProject.location || '')}`); } catch(e) { state.contractors = []; }
      } catch (e) {
        state.error = e.message;
      } finally {
        state.loading = false;
        render();
      }
    }

    async function loadChennaiDemo() {
      try {
        state.loading = true;
        render();
        const res = await apiRequest('/api/demo/load-chennai', 'POST');
        state.projects = await apiRequest('/api/projects');
        await selectProject(res.project_id);
        state.activePage = 'dashboard';
        state.notice = "Official Chennai Demo Project loaded with 8-agent dynamic architectural plan!";
      } catch (e) {
        state.error = e.message;
      } finally {
        state.loading = false;
        render();
      }
    }

    async function runAIPlan() {
      if (!state.currentProject) return;
      try {
        state.loading = true;
        state.activePage = 'planning';
        render();
        const plan = await apiRequest(`/api/projects/${state.currentProject.id}/ai-plan`, 'POST');
        state.aiPlan = plan;
        state.healthScore = await apiRequest(`/api/projects/${state.currentProject.id}/health-score`);
        state.decisions = await apiRequest(`/api/projects/${state.currentProject.id}/decisions`);
        state.notice = "AI Multi-Agent Construction Plan generated across all 8 agents successfully!";
      } catch (e) {
        state.error = e.message;
      } finally {
        state.loading = false;
        render();
      }
    }

    async function createProjectHandler(e) {
      e.preventDefault();
      const form = e.target;
      try {
        state.loading = true;
        render();
        // 1. Create project
        const proj = await apiRequest('/api/projects', 'POST', {
          project_name: form.project_name.value,
          location: form.location.value,
          status: 'planning'
        });
        // 2. Save requirements
        await apiRequest(`/api/projects/${proj.id}/requirements`, 'POST', {
          plot_width: parseFloat(form.plot_width.value),
          plot_length: parseFloat(form.plot_length.value),
          number_of_floors: parseInt(form.number_of_floors.value),
          bedrooms: parseInt(form.bedrooms.value),
          bathrooms: parseInt(form.bathrooms.value),
          parking_required: form.parking_required.value === 'true',
          budget: parseFloat(form.budget.value),
          architectural_style: form.architectural_style.value,
          construction_type: form.construction_type.value,
          target_completion_months: parseInt(form.target_completion_months.value),
          sustainability_priority: form.sustainability_priority.value,
          special_requirements: form.special_requirements.value
        });
        // 3. Immediately synthesize dynamic AI plan for this new project
        state.projects = await apiRequest('/api/projects');
        state.aiPlan = await apiRequest(`/api/projects/${proj.id}/ai-plan`, 'POST');
        await selectProject(proj.id);
        state.activePage = 'dashboard';
        state.notice = `Project "${proj.project_name}" created & full AI multi-agent blueprint synthesized!`;
      } catch(e) {
        state.error = e.message;
      } finally {
        state.loading = false;
        render();
      }
    }

    async function simulateWhatIfHandler(beds, budget, months, rate) {
      if (!state.currentProject) return;
      try {
        state.loading = true;
        render();
        const res = await apiRequest(`/api/projects/${state.currentProject.id}/what-if`, 'POST', {
          bedrooms: parseInt(beds),
          budget: parseFloat(budget),
          target_completion_months: parseInt(months),
          interest_rate: parseFloat(rate)
        });
        state.whatIfResult = res;
      } catch(e) {
        state.error = e.message;
      } finally {
        state.loading = false;
        render();
      }
    }

    function setPage(pageName) {
      state.activePage = pageName;
      state.notice = null;
      state.error = null;
      render();
    }

    function selectFloor(fNum) {
      state.selectedFloor = fNum;
      render();
    }

    // =========================================================
    // RENDER LOGIC
    // =========================================================
    function render() {
      const app = document.getElementById('app');
      const req = state.currentProject?.requirement || {
        plot_width: 30, plot_length: 50, plot_area: 1500,
        number_of_floors: 2, bedrooms: 3, bathrooms: 3, budget: 5000000,
        target_completion_months: 10, architectural_style: 'Modern Minimalist',
        parking_required: true, sustainability_priority: 'Medium'
      };

      const budgetLakh = (req.budget / 100000).toFixed(1);
      const estCost = state.aiPlan?.cost?.total_estimated_cost || (req.budget * 0.97);
      const estCostLakh = (estCost / 100000).toFixed(1);
      const variance = estCost - req.budget;
      const isOverrun = variance > 0;

      app.innerHTML = `
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
          <div class="sidebar-header">
            <div class="logo-badge">BW</div>
            <div class="logo-text">
              <h1>BuildWise AI</h1>
              <p>Construction Intelligence</p>
            </div>
          </div>

          <nav class="sidebar-nav">
            <div class="nav-section-title">Overview</div>
            <div class="nav-link ${state.activePage === 'landing' ? 'active' : ''}" onclick="setPage('landing')">
              <span>🏠 Home & Architecture</span>
            </div>
            <div class="nav-link ${state.activePage === 'dashboard' ? 'active' : ''}" onclick="setPage('dashboard')">
              <span>📊 Project Dashboard</span>
            </div>
            <div class="nav-link ${state.activePage === 'create' ? 'active' : ''}" onclick="setPage('create')">
              <span>✏️ New Project Intake</span>
            </div>
            <div class="nav-link ${state.activePage === 'planning' ? 'active' : ''}" onclick="setPage('planning')">
              <span>🧠 AI Multi-Agent Hub</span>
            </div>

            <div class="nav-section-title">Agent Blueprints</div>
            <div class="nav-link ${state.activePage === 'layout' ? 'active' : ''}" onclick="setPage('layout')">
              <span>🏠 House Layout</span>
            </div>
            <div class="nav-link ${state.activePage === 'design' ? 'active' : ''}" onclick="setPage('design')">
              <span>📐 2D Floor Plan & Blueprint</span>
            </div>
            <div class="nav-link ${state.activePage === 'cost' ? 'active' : ''}" onclick="setPage('cost')">
              <span>💰 Cost & BOQ Rates</span>
            </div>
            <div class="nav-link ${state.activePage === 'materials' ? 'active' : ''}" onclick="setPage('materials')">
              <span>🌿 Eco Materials</span>
            </div>
            <div class="nav-link ${state.activePage === 'timeline' ? 'active' : ''}" onclick="setPage('timeline')">
              <span>📅 CPM Timeline</span>
            </div>
            <div class="nav-link ${state.activePage === 'risk' ? 'active' : ''}" onclick="setPage('risk')">
              <span>⚠️ Risk Matrix</span>
            </div>
            <div class="nav-link ${state.activePage === 'interior' ? 'active' : ''}" onclick="setPage('interior')">
              <span>🛋️ Interior & Ergonomics</span>
            </div>
            <div class="nav-link ${state.activePage === 'finance' ? 'active' : ''}" onclick="setPage('finance')">
              <span>💳 Loan EMI & Cash Flow</span>
            </div>

            <div class="nav-section-title">Intelligence & Tools</div>
            <div class="nav-link ${state.activePage === 'whatif' ? 'active' : ''}" onclick="setPage('whatif')">
              <span>🎛️ What-If Simulator</span>
            </div>
            <div class="nav-link ${state.activePage === 'decisions' ? 'active' : ''}" onclick="setPage('decisions')">
              <span>📝 Decision Audit Log</span>
            </div>
            <div class="nav-link ${state.activePage === 'contractors' ? 'active' : ''}" onclick="setPage('contractors')">
              <span>👷 Contractor Marketplace</span>
            </div>
          </nav>

          <div class="sidebar-footer">
            <span>FastAPI + LangGraph</span>
            <span class="badge badge-success">Dynamic Engine</span>
          </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
          <header class="top-header">
            <div style="display:flex;align-items:center;gap:16px;">
              ${state.projects.length > 0 ? `
                <select class="form-control" style="width:280px;padding:6px 12px;font-size:0.85rem;" onchange="selectProject(this.value)">
                  ${state.projects.map(p => `
                    <option value="${p.id}" ${state.currentProject?.id === p.id ? 'selected' : ''}>
                      #${p.id} — ${p.project_name} (${p.location || 'Urban'})
                    </option>
                  `).join('')}
                </select>
              ` : ''}
              ${state.healthScore ? `
                <div class="badge badge-primary" style="padding:6px 14px;font-size:0.8rem;">
                  Health Score: <b>${state.healthScore.overall_score}/100</b> (${state.healthScore.grade})
                </div>
              ` : ''}
            </div>

            <div style="display:flex;align-items:center;gap:10px;">
              <button class="btn btn-secondary btn-sm" onclick="loadChennaiDemo()">
                ✨ Load Chennai Demo
              </button>
              ${state.currentProject ? `
                <a href="/api/projects/${state.currentProject.id}/report" class="btn btn-primary btn-sm" download target="_blank">
                  📄 Download PDF Report
                </a>
              ` : ''}
            </div>
          </header>

          ${state.notice ? `
            <div style="margin:16px 28px 0;padding:12px 16px;background:#E8F5E9;color:#2E7D32;border-radius:8px;border:1px solid #C8E6C9;font-size:0.88rem;">
              <b>Success:</b> ${state.notice}
            </div>
          ` : ''}

          ${state.error ? `
            <div style="margin:16px 28px 0;padding:12px 16px;background:#FFEBEE;color:#C62828;border-radius:8px;border:1px solid #FFCDD2;font-size:0.88rem;">
              <b>System Notice:</b> ${state.error}
            </div>
          ` : ''}

          <main class="page-content">
            ${renderPageContent(req, budgetLakh, estCostLakh, variance, isOverrun)}
          </main>
        </div>
      `;
    }

    // =========================================================
    // DYNAMIC PAGE CONTENT GENERATOR
    // =========================================================
    function renderPageContent(req, budgetLakh, estCostLakh, variance, isOverrun) {
      if (state.activePage === 'landing') {
        return `
          <div style="display:flex;flex-direction:column;gap:32px;">
            <div class="card" style="background:linear-gradient(135deg, #224435 0%, #233939 100%);color:#FFF;padding:48px 36px;">
              <div style="max-width:820px;">
                <div class="badge badge-gold" style="margin-bottom:16px;">AI Multi-Agent Construction Orchestration</div>
                <h1 style="font-size:2.3rem;font-weight:800;line-height:1.2;margin-bottom:16px;color:#FFFDE6;">
                  Truly Dynamic Floor Plans, Costing & Architectural Intelligence.
                </h1>
                <p style="font-size:1.02rem;color:rgba(255,255,255,0.85);line-height:1.6;margin-bottom:28px;">
                  BuildWise AI generates project-aware 2D geometric floor plans, deterministic Schedule of Rates (SOR) cost breakdowns, dynamic CPM construction schedules, and sustainable material recommendations based on your exact plot and budget inputs.
                </p>
                <div style="display:flex;gap:14px;flex-wrap:wrap;">
                  <button class="btn btn-secondary btn-lg" onclick="loadChennaiDemo()">✨ Launch Chennai Demo Project</button>
                  <button class="btn btn-outline btn-lg" style="color:#FFFDE6;border-color:#FFFDE6;" onclick="setPage('create')">Create Custom Home Project</button>
                </div>
              </div>
            </div>

            <div class="grid-4">
              <div class="card">
                <h3 style="font-size:1.05rem;color:var(--primary);margin-bottom:8px;font-weight:700;">Deterministic 2D Floor Plan</h3>
                <p style="font-size:0.86rem;color:var(--text-muted);">Non-overlapping spatial room allocation with setbacks, room dimensions, natural light vectors and floor zoning.</p>
              </div>
              <div class="card">
                <h3 style="font-size:1.05rem;color:var(--primary);margin-bottom:8px;font-weight:700;">Dynamic Cost BOQ</h3>
                <p style="font-size:0.86rem;color:var(--text-muted);">11-category Schedule of Rates (SOR) adapting to budget constraints, built-up area, and multi-storey premiums.</p>
              </div>
              <div class="card">
                <h3 style="font-size:1.05rem;color:var(--primary);margin-bottom:8px;font-weight:700;">Dynamic What-If Simulator</h3>
                <p style="font-size:0.86rem;color:var(--text-muted);">Simulates bedroom, floor, and budget changes with instant module delta recalculations.</p>
              </div>
              <div class="card">
                <h3 style="font-size:1.05rem;color:var(--primary);margin-bottom:8px;font-weight:700;">16-Section PDF Reports</h3>
                <p style="font-size:0.86rem;color:var(--text-muted);">One-click download of executive summaries, CPM schedules, and financial loan models.</p>
              </div>
            </div>
          </div>
        `;
      }

      if (state.activePage === 'create') {
        return `
          <div class="card" style="max-width:850px;margin:0 auto;">
            <div class="card-header">
              <h2 class="card-title">✏️ Homeowner Project Intake & Requirements Form</h2>
              <span class="badge badge-primary">Custom Input</span>
            </div>

            <form onsubmit="createProjectHandler(event)">
              <div class="grid-2">
                <div class="form-group">
                  <label class="form-label">Project Name</label>
                  <input name="project_name" class="form-control" value="Modern Green Oasis" required />
                </div>
                <div class="form-group">
                  <label class="form-label">Location / City</label>
                  <input name="location" class="form-control" value="Chennai (Anna Nagar / OMR)" required />
                </div>
              </div>

              <div class="grid-3">
                <div class="form-group">
                  <label class="form-label">Plot Width (ft)</label>
                  <input name="plot_width" type="number" step="0.1" class="form-control" value="30" required oninput="document.getElementById('plot_area_preview').value = (this.value * document.getElementsByName('plot_length')[0].value) || 0" />
                </div>
                <div class="form-group">
                  <label class="form-label">Plot Length (ft)</label>
                  <input name="plot_length" type="number" step="0.1" class="form-control" value="50" required oninput="document.getElementById('plot_area_preview').value = (this.value * document.getElementsByName('plot_width')[0].value) || 0" />
                </div>
                <div class="form-group">
                  <label class="form-label">Plot Area (sq.ft)</label>
                  <input id="plot_area_preview" type="number" class="form-control" value="1500" disabled style="background:#f5f5f5;" />
                </div>
              </div>

              <div class="grid-4">
                <div class="form-group">
                  <label class="form-label">Number of Floors</label>
                  <select name="number_of_floors" class="form-control">
                    <option value="1">Ground Floor (G+0)</option>
                    <option value="2" selected>2 Floors (G+1)</option>
                    <option value="3">3 Floors (G+2)</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Bedrooms (BHK)</label>
                  <input name="bedrooms" type="number" class="form-control" value="3" min="1" max="8" required />
                </div>
                <div class="form-group">
                  <label class="form-label">Bathrooms</label>
                  <input name="bathrooms" type="number" class="form-control" value="3" min="1" max="8" required />
                </div>
                <div class="form-group">
                  <label class="form-label">Parking Required</label>
                  <select name="parking_required" class="form-control">
                    <option value="true" selected>Yes (Covered Porch)</option>
                    <option value="false">No</option>
                  </select>
                </div>
              </div>

              <div class="grid-3">
                <div class="form-group">
                  <label class="form-label">Target Budget (INR)</label>
                  <input name="budget" type="number" class="form-control" value="5000000" step="50000" required />
                </div>
                <div class="form-group">
                  <label class="form-label">Target Timeline (Months)</label>
                  <input name="target_completion_months" type="number" class="form-control" value="10" min="4" max="24" required />
                </div>
                <div class="form-group">
                  <label class="form-label">Sustainability Priority</label>
                  <select name="sustainability_priority" class="form-control">
                    <option value="Low">Standard Grid</option>
                    <option value="Medium" selected>Medium (Low-VOC, AAC Blocks)</option>
                    <option value="High">High (Solar PV, Rainwater, Eco)</option>
                  </select>
                </div>
              </div>

              <div class="grid-2">
                <div class="form-group">
                  <label class="form-label">Architectural Style</label>
                  <select name="architectural_style" class="form-control">
                    <option value="Modern" selected>Modern Minimalist</option>
                    <option value="Contemporary">Contemporary Scandinavian</option>
                    <option value="Traditional">Traditional Regional</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Construction Type</label>
                  <select name="construction_type" class="form-control">
                    <option value="RCC Frame" selected>RCC Frame Structure</option>
                    <option value="Modular PEB">Modular Steel + AAC</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Special Customization Requirements</label>
                <textarea name="special_requirements" class="form-control" rows="2">Rooftop solar PV 3kWp with net-metering and EV charging point</textarea>
              </div>

              <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:12px;">
                🚀 Submit Requirements & Generate Dynamic AI Plan
              </button>
            </form>
          </div>
        `;
      }

      if (state.activePage === 'dashboard') {
        const fp = state.aiPlan?.design?.floor_plan;
        const totalBuiltUp = state.aiPlan?.design?.total_built_up_area || (req.plot_width * req.plot_length * 0.7 * req.number_of_floors);
        const carpetArea = state.aiPlan?.design?.carpet_area || (totalBuiltUp * 0.8);
        const style = state.aiPlan?.design?.design_style || req.architectural_style || 'Modern';

        return `
          <div style="display:flex;flex-direction:column;gap:24px;">
            <!-- KPI Cards -->
            <div class="grid-4">
              <div class="stat-card">
                <span class="stat-title">Homeowner Budget</span>
                <span class="stat-value">₹${budgetLakh} L</span>
                <span class="stat-sub">Allocated Corpus <span class="badge badge-success">USER INPUT</span></span>
              </div>
              <div class="stat-card">
                <span class="stat-title">Estimated Cost</span>
                <span class="stat-value">₹${estCostLakh} L</span>
                <span class="stat-sub">
                  ${isOverrun ? `<span class="badge badge-danger">OVERRUN: ₹${(variance/100000).toFixed(1)}L</span>` : `<span class="badge badge-success">BUFFER: ₹${(Math.abs(variance)/100000).toFixed(1)}L</span>`}
                </span>
              </div>
              <div class="stat-card">
                <span class="stat-title">Timeline Duration</span>
                <span class="stat-value">${state.aiPlan?.timeline?.total_duration_months || req.target_completion_months || 10} Mos</span>
                <span class="stat-sub">CPM Scheduled <span class="badge badge-info">CPM ENGINE</span></span>
              </div>
              <div class="stat-card">
                <span class="stat-title">Project Health</span>
                <span class="stat-value" style="color:var(--success);">${state.healthScore?.overall_score || 92}/100</span>
                <span class="stat-sub">${state.healthScore?.grade || 'A'} - ${state.healthScore?.rating || 'Excellent'}</span>
              </div>
            </div>

            <!-- Active Project Banner -->
            <div class="card" style="background:var(--light);display:flex;justify-content:space-between;align-items:center;padding:18px 24px;">
              <div>
                <h3 style="color:var(--primary);font-weight:700;">${state.currentProject?.project_name || 'Home Construction Project'}</h3>
                <p style="font-size:0.85rem;margin-top:4px;">
                  Location: <b>${state.currentProject?.location || req.location || 'Chennai'}</b> | 
                  Configuration: <b>${req.bedrooms || 3} BHK (${req.bathrooms || 3} Baths)</b> |

      }

      if (state.activePage === 'planning') {
        const statuses = state.aiPlan?.agent_execution_status || {};
        const agentList = [
          { key: "Requirement Agent", role: "NLP extraction & parameter validation" },
          { key: "Design Agent", role: "2D spatial zoning & non-overlapping geometry" },
          { key: "Cost Estimation Agent", role: "11-category SOR & budget constraint evaluation" },
          { key: "Material Recommendation Agent", role: "Eco-durability rating & green specifications" },
          { key: "Timeline Agent", role: "CPM Critical Path Method scheduling" },
          { key: "Risk Prediction Agent", role: "8-dimension construction risk matrix (P × I)" },
          { key: "Interior Design Agent", role: "Room-wise ergonomics, lighting & color palette" },
          { key: "Finance Agent", role: "Loan amortization & milestone cash flow" },
        ];

        return `
          <div style="display:flex;flex-direction:column;gap:24px;">
            <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <h2 class="card-title">🧠 LangGraph Multi-Agent Orchestration Hub</h2>
                <p style="font-size:0.85rem;color:var(--text-muted);">8 Specialized Agents executing synchronously over unified Pydantic ProjectState.</p>
              </div>
              <button class="btn btn-primary" onclick="runAIPlan()">
                ▶️ Execute Multi-Agent Plan
              </button>
            </div>

            <div class="grid-2">
              ${agentList.map(ag => {
                const st = statuses[ag.key] || { status: 'COMPLETED', confidence: 0.94 };
                return `
                  <div class="card" style="border-left:5px solid var(--success);">
                    <div style="display:flex;justify-content:space-between;">
                      <h4 style="font-weight:700;color:var(--dark);">${ag.key}</h4>
                      <span class="badge badge-success">${st.status || 'COMPLETED'}</span>
                    </div>
                    <p style="font-size:0.8rem;color:var(--text-muted);margin:6px 0;">${ag.role}</p>
                    <div style="font-size:0.75rem;color:var(--primary);margin-top:8px;padding-top:6px;border-top:1px solid var(--light);">
                      Confidence: <b>${Math.round((st.confidence || 0.94) * 100)}%</b> | Mode: <b>Deterministic Python + LangGraph</b>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      return `<div class="card"><h2>Page not found</h2></div>`;
    }

    // Start App reliably regardless of document readyState
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
